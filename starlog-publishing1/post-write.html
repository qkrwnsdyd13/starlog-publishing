<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>글쓰기</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/post-write.css">
</head>
<body>
  <div class="navbar">
    <a href="index.html" class="navbar-brand">STARLOG</a>
      <div class="navbar-menu">
          <a href="post-list.html">게시판</a>
          <a href="mypage.html">user1님</a>
          <a href="index.html">로그아웃</a>
    </div>
  </div>

  <div class="container">
    <div class="write-box">

      <!-- [퍼블리싱] 서버가 오류 시 넣어주던 메시지입니다.
      <div class="error-message">
        <span>제목과 내용을 입력해주세요.</span>
      </div>
      -->

      <form action="post-detail.html" method="get">
        
        <div class="form-group">
          <input type="text" id="title" name="title"
                placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
          <textarea id="content" name="content"
                    placeholder="나누고 싶은 이야기를 적어보세요." required></textarea>
        </div>

        <div class="tmp">
          <div class="form-group">
              <label style="color: #C7D7F9; display: block; margin-bottom: 10px;">이미지 첨부</label>
              <input type="file" name="imageFile" accept="image/*" multiple style="color: #C7D7F9;">
          </div>

          <div class="button-group">
            <button type="submit">작성완료</button>
            <a href="post-list.html" class="btn-cancel">취소</a>
          </div>
        </div>
        
      </form>
    </div>
  </div>

</div>
</body>
</html>
